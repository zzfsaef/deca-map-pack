name: mirror-deca-map

# 抓 mathartbang 地图站，汉化，然后「按保护区分别打包」发到 Release。
#
#   prepare  算一遍要跑哪些保护区、建好 Release
#   base     框架 + /deca/lib/ + 全部保护区的三个 JSON（一会儿就完，产出一个小包）
#   maps     一个保护区一个任务，并发跑；各自抓图、各自打自己的包、各自上传
#
# 分包规则见 pack_maps.py：单保护区超过 1.8GB 自动拆成 -images / -tiles-N。
# 抓之前 check_coverage.py 会对账，覆盖率不到 98% 就不发这个保护区的包，
# 免得半残的地图被当成完整的发出去。
#
# 注意：只有手动触发（Actions 页面 Run workflow）才会跑。全量一趟要下十几 GB，
# 不适合挂在 push 上顺手带起来。

on:
  workflow_dispatch:
    inputs:
      reserves:
        description: '要抓的保护区，空格分隔（r6=育空河谷）；留空 = 全部'
        required: false
        default: ''
      threads:
        description: '每个任务里的下载线程数'
        required: false
        default: '8'
      parallel:
        description: '同时跑几个保护区任务（注意别把源站打疼）'
        required: false
        default: '3'
      min_coverage:
        description: '图片覆盖率下限，低于它就不发包'
        required: false
        default: '0.98'

permissions:
  contents: write

# 一次全量挺贵的，别让两次运行叠在一起抢源站
concurrency:
  group: mirror-deca-map
  cancel-in-progress: false

env:
  ALL_RESERVES: 'r0 r1 r2 r3 r4 r6 r8 r9 r10 r11 r12 r13 r14 r16 r17 r18 r19 r20 r21'
  SITE_BASE: 'https://www.mathartbang.com'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      reserves: ${{ steps.pick.outputs.reserves }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: 选定保护区 + 建 Release
        id: pick
        env:
          WANT: ${{ inputs.reserves }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mirror-${GITHUB_RUN_NUMBER}"
          RESERVES="$(echo "${WANT:-$ALL_RESERVES}" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          export RESERVES
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "reserves=$RESERVES" >> "$GITHUB_OUTPUT"
          MATRIX=$(python3 -c 'import json,os;print(json.dumps(os.environ["RESERVES"].split()))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          {
            echo "### 本次要跑的保护区"
            echo '```'
            echo "$RESERVES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 说明写到文件里再传，避免在 YAML 里塞多行字符串（缩进会把 YAML 搞断）
          cat > notes.md <<'EOF'
          每个保护区一个图片包，另有一个必下的框架包。

          1. 下载 `deca-map-base.zip`（框架，必下）和想玩的地图包
          2. 全部解压到同一个目录，会拼出一个 `site/`
          3. 起个本地服务：

          ```
          python -m http.server 8000 --directory site
          ```

          然后打开 http://localhost:8000/deca/hp/map.html
          EOF
          # 上面每行都带着 YAML 块的缩进，去掉，否则 markdown 会整段当成代码块
          sed -i 's/^[[:space:]]\{1,\}//' notes.md
          # 别用 `|| echo` 把失败糊过去：那样 Release 没建出来，后面每个任务
          # 都会在上传时报 "release not found"，却看不到真正的原因。
          if gh release create "$TAG" \
               --title "deca 地图镜像 #${GITHUB_RUN_NUMBER}（分地图打包）" \
               --notes-file notes.md; then
            echo "Release $TAG 建好了"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已经存在，直接往里传"
          else
            echo "::error::既建不了也读不到 Release $TAG。八成是仓库设置里 Actions 没有写权限："
            echo "::error::Settings → Actions → General → Workflow permissions → 选 Read and write permissions"
            exit 1
          fi

  # ---------------------------------------------------------------- 框架包
  base:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成第一遍清单
        env:
          RESERVES: ${{ needs.prepare.outputs.reserves }}
        run: |
          : > bootstrap.txt
          for f in index.html map.html tool/save.html; do
            echo "$SITE_BASE/deca/hp/$f" >> bootstrap.txt
          done
          for r in $RESERVES; do
            for f in reserve pois layers; do
              echo "$SITE_BASE/deca/hp/data/$r/$f.json" >> bootstrap.txt
            done
          done
          echo "第一遍 URL 数: $(wc -l < bootstrap.txt)"

      # --skip-prefix：不从页面里跟 data/ 下的链接（图片归 maps 任务按清单抓），
      # 但 /deca/lib/ 会被自动发现并抓下来。明确列出的起始 URL 不受 skip 影响。
      - name: 第一遍 — 框架 + lib/
        continue-on-error: true
        run: |
          python -u mirror_site.py --out site --prefix /deca/ \
            --skip-prefix /deca/hp/data/ \
            --seeds-file bootstrap.txt --jobs ${{ inputs.threads || 8 }} \
            --report report-base.json 2>&1 | tee base.log

      - name: 检查框架是否抓全
        run: |
          miss=0
          for f in deca/hp/index.html deca/hp/map.html deca/hp/tool/save.html \
                   deca/lib/deca_adf.js; do
            [ -s "site/$f" ] || { echo "::warning::缺 site/$f"; miss=$((miss+1)); }
          done
          n=$(find site/deca/hp/data -name layers.json 2>/dev/null | wc -l)
          echo "layers.json: $n 个 / $(wc -w <<< '${{ needs.prepare.outputs.reserves }}') 个保护区"
          if [ "$miss" -gt 2 ]; then
            echo "::error::框架基本没抓到（缺 $miss 个关键文件），看看 base.log"
            exit 1
          fi

      # 站点靠 JS 在运行时拼出 wasm 路径，爬虫抓不到，必须显式补。
      # 这个 wasm 在 deca 的公开仓库里，且与站点用的 deca_adf.js 是同一版本。
      - name: 补齐缺失的 WASM
        run: |
          mkdir -p site/deca/lib
          curl -sSL --fail --retry 3 --max-time 180 \
            -o site/deca/lib/deca_adf.wasm \
            https://raw.githubusercontent.com/kk49/deca/main/support/wasm/deca_adf.wasm
          python - <<'PY'
          d = open('site/deca/lib/deca_adf.wasm', 'rb').read()
          assert d[:4] == b'\x00asm', 'not a wasm'
          print('wasm OK:', len(d), 'bytes')
          PY

      - name: 汉化
        run: python localize.py --site site

      - name: 加「选择存档文件夹」按钮
        run: python patch_saveload.py --site site

      - name: 打包框架包
        run: python pack_maps.py --site site --out dist --mode base

      - name: 上传框架包
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ls -lh dist
          gh release upload "$TAG" dist/*.zip --clobber

      - name: 汇总
        if: always()
        run: |
          {
            echo "### 框架包"
            echo '```'
            echo "site 文件数: $(find site -type f 2>/dev/null | wc -l)"
            du -sh site dist 2>/dev/null
            ls -lh dist 2>/dev/null
            echo '```'
            echo "### 第一遍日志尾部"
            echo '```'
            tail -30 base.log 2>/dev/null || echo "(没有 base.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- 每个保护区一个包
  maps:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    name: map ${{ matrix.reserve }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel || '3') }}
      matrix:
        reserve: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 取该保护区的三个 JSON
        env:
          R: ${{ matrix.reserve }}
        run: |
          mkdir -p "site/deca/hp/data/$R"
          for f in reserve pois layers; do
            curl -sSL --fail --retry 3 --max-time 120 \
              -o "site/deca/hp/data/$R/$f.json" "$SITE_BASE/deca/hp/data/$R/$f.json"
          done
          ls -l "site/deca/hp/data/$R"

      - name: 生成图片清单
        env:
          R: ${{ matrix.reserve }}
        run: |
          python gen_urls.py --site site --reserves "$R" > assets.txt
          echo "URL 数: $(wc -l < assets.txt)"

      - name: 抓图（热力图 + 底图瓦片）
        continue-on-error: true
        env:
          R: ${{ matrix.reserve }}
        run: |
          python -u mirror_site.py --out site --prefix /deca/ \
            --seeds-file assets.txt --jobs ${{ inputs.threads || 8 }} \
            --report "report-$R.json" 2>&1 | tee "map-$R.log"

      # 这一步失败 = 这个保护区的图没抓全：先写完摘要和缺失清单，再非零退出，
      # 后面的打包/上传就不会跑，release 里也就不会出现半残的包。
      - name: 对账（覆盖率不够就不发这个包）
        env:
          R: ${{ matrix.reserve }}
          MIN: ${{ inputs.min_coverage || '0.98' }}
        run: |
          # 别用 `... | tee` 再取 $?：GitHub 默认 shell 没有 pipefail，
          # 那样拿到的是 tee 的退出码，门禁就形同虚设。
          set +e
          python check_coverage.py --site site --list assets.txt \
            --min "$MIN" --missing-out "missing-$R.txt" > "check-$R.log" 2>&1
          rc=$?
          cat "check-$R.log" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "#### $R 抓取结果"
            echo '```'
            if [ -f "map-$R.log" ]; then
              grep -E '^\[=\] 完成|^\[!\]' "map-$R.log" || true
            else
              echo "(没有 map-$R.log，抓取那步可能没跑起来)"
            fi
            echo '```'
            if [ -s "missing-$R.txt" ]; then
              echo "<details><summary>没抓到的 URL（前 30 条，全量在 missing-$R.txt）</summary>"
              echo
              echo '```'
              head -30 "missing-$R.txt"
              echo '```'
              echo "</details>"
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::$R 有图没抓全，不打这个包（release 里不会有它）。缺的 URL 见上面。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: 汉化
        run: python localize.py --site site

      - name: 打包这个保护区
        env:
          R: ${{ matrix.reserve }}
        run: python pack_maps.py --site site --out dist --mode maps --reserves "$R"

      - name: 上传
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          R: ${{ matrix.reserve }}
        run: |
          ls -lh dist
          gh release upload "$TAG" dist/*.zip --clobber

  # ---------------------------------------------------------------- 收尾
  summary:
    needs: [prepare, base, maps]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 列出这次发布的资源
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BASE_RESULT: ${{ needs.base.result }}
          MAPS_RESULT: ${{ needs.maps.result }}
        run: |
          {
            echo "# deca 地图镜像 $TAG"
            echo
            echo "框架任务: $BASE_RESULT ｜ 地图任务: $MAPS_RESULT"
            echo
            echo "| 资源 | 大小 |"
            echo "|---|---|"
            gh release view "$TAG" --json assets \
              --jq '.assets[] | "| \(.name) | \((.size/1048576*10|floor)/10) MB |"' || true
          } >> "$GITHUB_STEP_SUMMARY"
